name: Semantic version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Select the semantic version increment.
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and create tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run semantic versioning from the main branch."
          exit 1

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1

      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          BEFORE_RUN_ID="$(gh run list --workflow ci.yml --branch main --commit "$SHA" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run ci.yml --ref main

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow ci.yml --branch main --commit "$SHA" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$BEFORE_RUN_ID" ]; then
              break
            fi
            RUN_ID=""
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::A CI run was not created for main commit: $SHA"
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status

          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$CURRENT_MAIN_SHA" != "$SHA" ]; then
            echo "::error::main changed while CI was running; retry the version dispatch."
            exit 1
          fi

      - name: Bump semantic version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          npm version "$BUMP" --no-git-tag-version
          TAG="v$(node -p "require('./package.json').version")"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Tag already exists: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit version and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): $TAG"
          git push origin HEAD:main
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

  release:
    name: Run release pipeline
    needs: [version]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: write
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      PROGET_API_KEY: ${{ secrets.PROGET_API_KEY }}
