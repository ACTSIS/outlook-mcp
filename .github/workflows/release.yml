name: Release

# Only an explicitly pushed tag or a validated reusable-workflow call may
# publish a release. Branch pushes and pull requests never trigger this workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Semantic version tag to release
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        target: ['win-x64', 'linux-x64']
        include:
          - target: win-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package target
        run: npm run package -- --target ${{ matrix.target }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  validate:
    name: Validate modes (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [build]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: win-x64
            os: windows-latest
            artifact: dist/win-x64/outlook-mcp-win-x64.exe
          - target: linux-x64
            os: ubuntu-latest
            artifact: dist/linux-x64/outlook-mcp-linux-x64
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-${{ matrix.target }}
          path: dist/${{ matrix.target }}

      - name: Restore Linux executable permission
        if: matrix.target == 'linux-x64'
        shell: bash
        run: chmod +x "${{ matrix.artifact }}"

      - name: Validate mcp mode boots
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          "${{ matrix.artifact }}" mcp >"$LOG" 2>&1 &
          PID=$!
          for _ in $(seq 1 30); do
            if grep -q "connected and listening" "$LOG"; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "mcp mode exited early:"; cat "$LOG"; exit 1
            fi
            sleep 1
          done
          grep -q "connected and listening" "$LOG"
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Validate auth mode serves the callback endpoint
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          "${{ matrix.artifact }}" auth >"$LOG" 2>&1 &
          PID=$!
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3333/ | grep -q 200; then
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "auth mode exited early:"; cat "$LOG"; exit 1
            fi
            sleep 1
          done
          curl -sf http://localhost:3333/ >/dev/null
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: [build, validate]
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Scan dist artifacts for embedded credentials
        shell: bash
        run: |
          set -euo pipefail
          node -e "const { scanDirectory, canPublish, report } = require('./build/secret-scan'); const findings = scanDirectory('dist'); console.log(report(findings)); if (!canPublish(findings)) process.exit(1);"

  # T21 (S12), extended by T28 (S15): downloadable loadable Docker image for
  # the GitHub Releases channel AND the provenance source for the GHCR
  # publication. Builds the committed Dockerfile at the exact release ref
  # with OCI provenance labels and uploads it as a checksummed loadable
  # archive. This job stays registry-free: the later `publish-container` job
  # does the ONLY registry work, from this exact artifact. The `docker-image`
  # artifact name deliberately does not match the `artifact-*` and
  # `installer-*` wildcards that the provenance, publisher, and container
  # jobs download, so the publisher payload stays byte-identical.
  docker-image:
    name: Build Docker image artifact
    runs-on: ubuntu-latest
    needs: [build, validate, scan]
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::release tag $RELEASE_TAG is not a v<major>.<minor>.<patch> tag"
              exit 1
              ;;
          esac
          tag_version="${RELEASE_TAG#v}"
          pkg_version="$(node -e "console.log(require('./package.json').version)")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $RELEASE_TAG does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Build image for linux/amd64 with version and local tags
        shell: bash
        run: |
          set -euo pipefail
          # OCI provenance labels are added at the ORIGINAL build, before the
          # archive exists and before any registry publication. The caller's
          # github.sha in a reusable workflow can point at its pre-bump
          # commit, so the revision label MUST come from this exact release
          # checkout via git rev-parse HEAD instead.
          REVISION="$(git rev-parse HEAD)"
          SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG#v}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            -t "outlook-mcp-http:${RELEASE_TAG#v}" \
            -t outlook-mcp-http:local \
            .
          docker image inspect "outlook-mcp-http:${RELEASE_TAG#v}" outlook-mcp-http:local

      - name: Save both tags to a checksummed gzipped archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_DIR="${RUNNER_TEMP}/docker-image-bundle"
          mkdir -p "$ARCHIVE_DIR"
          # `docker image save` (never the filesystem-level `export` verb)
          # produces a loadable archive containing BOTH tags, and `docker
          # load` restores them as-is.
          docker image save \
            -o "$ARCHIVE_DIR/outlook-mcp-docker-image.tar" \
            "outlook-mcp-http:${RELEASE_TAG#v}" outlook-mcp-http:local
          gzip "$ARCHIVE_DIR/outlook-mcp-docker-image.tar"
          cd "$ARCHIVE_DIR"
          sha256sum outlook-mcp-docker-image.tar.gz > outlook-mcp-docker-image.tar.gz.sha256

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: |
            ${{ runner.temp }}/docker-image-bundle/outlook-mcp-docker-image.tar.gz
            ${{ runner.temp }}/docker-image-bundle/outlook-mcp-docker-image.tar.gz.sha256
          if-no-files-found: error
          # The archive is already gzipped; artifact-level compression only
          # wastes time on top of it.
          compression-level: 0

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, validate, scan, docker-image]
    permissions:
      contents: write
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Download Docker image bundle
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: dist/docker-image

      - name: Verify complete artifact set before publishing
        shell: bash
        run: |
          set -euo pipefail
          for FILE in dist/outlook-mcp-win-x64.exe dist/outlook-mcp-linux-x64 dist/docker-image/outlook-mcp-docker-image.tar.gz dist/docker-image/outlook-mcp-docker-image.tar.gz.sha256; do
            if [ ! -f "$FILE" ]; then
              echo "missing required artifact: $FILE"; exit 1
            fi
          done
          echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Verify Docker image bundle checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist/docker-image
          sha256sum -c outlook-mcp-docker-image.tar.gz.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/outlook-mcp-win-x64.exe dist/outlook-mcp-linux-x64 dist/docker-image/outlook-mcp-docker-image.tar.gz dist/docker-image/outlook-mcp-docker-image.tar.gz.sha256 --generate-notes

  installer-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [build]
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          pkg_version="$(node -e "console.log(require('./package.json').version)")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $RELEASE_TAG does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-win-x64
          path: build/windows

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.10 --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:Path += ";${env:ProgramFiles(x86)}\NSIS"
          makensis "-DVERSION=${{ steps.version.outputs.version }}" build\windows\installer.nsi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-x64
          # NSIS 3 resolves the OutFile relative to the script directory.
          path: build/windows/outlook-mcp-setup.exe
          if-no-files-found: error

  installer-linux:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          pkg_version="$(node -e "console.log(require('./package.json').version)")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $RELEASE_TAG does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-linux-x64
          path: dist/linux-x64

      - name: Fetch packaging tools
        shell: bash
        run: build/linux/fetch-tools.sh

      - name: Build .deb package
        shell: bash
        run: build/linux/package-deb.sh
        env:
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Scan .deb payload for secrets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DEB_PATH="dist/linux-x64/outlook-mcp_${VERSION}_amd64.deb"
          TMP_DIR="$(mktemp -d)"
          export SCAN_DIR="$TMP_DIR"
          trap 'rm -rf "$TMP_DIR"' EXIT
          dpkg-deb --fsys-tarfile "$DEB_PATH" | tar -x -C "$TMP_DIR"
          node -e "const { scanDirectory, canPublish, report } = require('./build/secret-scan'); const findings = scanDirectory(process.env.SCAN_DIR); console.log(report(findings)); if (!canPublish(findings)) process.exit(1);"

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64
          path: dist/linux-x64/outlook-mcp_${{ steps.version.outputs.version }}_amd64.deb
          if-no-files-found: error

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [installer-windows, installer-linux]
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/installers
          pattern: installer-*
          merge-multiple: true

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DEB_PATH="dist/installers/outlook-mcp_${VERSION}_amd64.deb"
          docker run --rm \
            -v "$PWD/$DEB_PATH:/tmp/outlook-mcp_amd64.deb" \
            -v "$PWD/build/linux/tests/container-smoke.sh:/tmp/container-smoke.sh" \
            ubuntu:24.04 \
            bash /tmp/container-smoke.sh /tmp/outlook-mcp_amd64.deb

  provenance:
    name: Generate provenance
    runs-on: ubuntu-latest
    needs: [smoke]
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download raw product artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cd dist
          sha256sum outlook-mcp-win-x64.exe outlook-mcp-linux-x64 outlook-mcp-setup.exe "outlook-mcp_${VERSION}_amd64.deb" > SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/outlook-mcp-${{ steps.version.outputs.version }}-sbom.spdx.json
          upload-artifact: false

      - name: Upload provenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: |
            dist/SHA256SUMS
            dist/outlook-mcp-${{ steps.version.outputs.version }}-sbom.spdx.json
          if-no-files-found: error

  publish-artifacts:
    name: Publish installer assets to GitHub Release
    runs-on: ubuntu-latest
    needs: [release, installer-windows, installer-linux, provenance]
    # S14 GitHub-only distribution: the release job already publishes the
    # raw binaries and the Docker bundle; this job appends ONLY the
    # installer, provenance, and manifest assets. It runs in every
    # repository (no credential guard to skip), consumes no custom secrets,
    # and uses the built-in `github.token`; an existing release asset must
    # never be overwritten, so `gh release upload` is called without
    # `--clobber`.
    permissions:
      contents: write
    timeout-minutes: 20
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download raw product artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: Download provenance artifacts
        uses: actions/download-artifact@v4
        with:
          name: provenance
          path: dist/provenance

      - name: Verify required assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for FILE in \
            dist/outlook-mcp-setup.exe \
            "dist/outlook-mcp_${VERSION}_amd64.deb" \
            dist/outlook-mcp-win-x64.exe \
            dist/outlook-mcp-linux-x64 \
            dist/provenance/SHA256SUMS \
            "dist/provenance/outlook-mcp-${VERSION}-sbom.spdx.json"; do
            if [ ! -f "$FILE" ]; then
              echo "missing required asset: $FILE"; exit 1
            fi
          done
          cp dist/provenance/SHA256SUMS dist/SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS

      - name: Verify the target release version
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          if [ "$ACTUAL" != "$RELEASE_TAG" ]; then
            echo "::error::release $RELEASE_TAG not found on $GITHUB_REPOSITORY (got: $ACTUAL)"
            exit 1
          fi

      - name: Upload installer and provenance assets to the release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # An existing release asset is never overwritten: no clobber flag
          # is ever passed.
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            dist/outlook-mcp-setup.exe \
            "dist/outlook-mcp_${VERSION}_amd64.deb" \
            dist/provenance/SHA256SUMS \
            "dist/provenance/outlook-mcp-${VERSION}-sbom.spdx.json"

      - name: Generate and upload the latest-stable manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ASSETS="outlook-mcp-setup.exe,outlook-mcp_${VERSION}_amd64.deb,outlook-mcp-win-x64.exe,outlook-mcp-linux-x64"
          node build/release-manifest.js \
            --version "$VERSION" \
            --date "$DATE" \
            --assets "$ASSETS" \
            --repository "$GITHUB_REPOSITORY" \
            < dist/provenance/SHA256SUMS > latest-stable.json
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" latest-stable.json

  # T28 (S15/S16): publish the already-tested image to the repository-linked
  # GHCR namespace. This job alone carries `packages:write`; it never
  # rebuilds the image (it loads the exact `docker-image` artifact verified
  # by the sidecar), never falls back to another namespace or credential,
  # never replaces an existing version tag built from a different image, and
  # never advances `latest` unless this tag is the repository's current
  # GitHub latest release. The first package of a repository starts PRIVATE
  # regardless of repository visibility and the workflow never mutates
  # visibility — the job summary says so honestly instead of claiming
  # anonymous pulls.
  publish-container:
    name: Publish the tested image to GHCR
    runs-on: ubuntu-latest
    needs: [release, publish-artifacts, docker-image]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    concurrency:
      group: publish-container-${{ github.repository }}
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download the exact tested Docker image bundle
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: docker-image-bundle

      - name: Prepare the isolated registry credential directory
        shell: bash
        run: |
          set -euo pipefail
          # jobs.<job>.env cannot use the runner context (GitHub rejected the
          # workflow for that expression), so the isolated credential
          # directory is exported here as RUNTIME configuration for every
          # following step through the GITHUB_ENV primitive, before ANY
          # docker command runs. The directory lives under RUNNER_TEMP only:
          # never inside the repository or workspace, never a fixed global
          # location, and the token is never written there until the login
          # step below (umask 077).
          umask 077
          DOCKER_CONFIG_PRIVATE="${RUNNER_TEMP}/.docker-config"
          mkdir -p "$DOCKER_CONFIG_PRIVATE"
          chmod 700 "$DOCKER_CONFIG_PRIVATE"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG_PRIVATE" >> "$GITHUB_ENV"
      - name: Verify the bundle checksum before loading or logging in
        shell: bash
        run: |
          set -euo pipefail
          cd docker-image-bundle
          sha256sum -c outlook-mcp-docker-image.tar.gz.sha256

      - name: Load the tested image without rebuilding it
        shell: bash
        run: |
          set -euo pipefail
          # docker load accepts the already-gzipped archive directly.
          docker load --input docker-image-bundle/outlook-mcp-docker-image.tar.gz
          docker image inspect "outlook-mcp-http:${RELEASE_TAG#v}" outlook-mcp-http:local

      - name: Verify the loaded image ships the HTTP command and provenance labels
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="outlook-mcp-http:${RELEASE_TAG#v}"
          EXPECTED_SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          CMD="$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE_REF")"
          if [ "$CMD" != '["node","bin/m365-mcp.js","http"]' ]; then
            echo "::error::refusing to publish: image command is $CMD, expected node bin/m365-mcp.js http (HTTP, never stdio)"
            exit 1
          fi
          SOURCE="$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')"
          if [ "$SOURCE" != "$EXPECTED_SOURCE" ]; then
            echo "::error::refusing to publish: image source label is '$SOURCE', expected '$EXPECTED_SOURCE'"
            exit 1
          fi
          VERSION="$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          if [ "$VERSION" != "${RELEASE_TAG#v}" ]; then
            echo "::error::refusing to publish: image version label is '$VERSION', expected ${RELEASE_TAG#v}"
            exit 1
          fi

      - name: Log in to ghcr.io only, with the built-in token through stdin
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          # The token travels exclusively through stdin; it is never a
          # command argument and is never echoed or logged.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Guard the version tag against replacing a different published image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          VERSION="${RELEASE_TAG#v}"
          FULL_TAG="${IMAGE}:${VERSION}"
          LOCAL_ID="$(docker image inspect --format '{{.Id}}' "outlook-mcp-http:${VERSION}")"
          if MANIFEST_OUTPUT="$(docker manifest inspect "$FULL_TAG" 2>&1)"; then
            MANIFEST_STATUS=0
          else
            MANIFEST_STATUS=$?
          fi
          if [ "$MANIFEST_STATUS" -eq 0 ]; then
            REMOTE_DIGEST="$(printf '%s\n' "$MANIFEST_OUTPUT" | node -e 'let s="";process.stdin.on("data",(c)=>{s+=c});process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(s).config.digest||"")}catch{}})')"
            if [ -z "$REMOTE_DIGEST" ]; then
              echo "::error::$FULL_TAG already exists as a manifest of unknown schema; refusing to treat it as replaceable"
              exit 1
            fi
            if [ "$REMOTE_DIGEST" != "$LOCAL_ID" ]; then
              echo "::error::$FULL_TAG is already published as $REMOTE_DIGEST but this built image is $LOCAL_ID; version tags are immutable for different images"
              exit 1
            fi
            echo "Version tag $FULL_TAG already matches this image; publication is idempotent and the version push is skipped."
            exit 0
          fi
          # ONLY a proven manifest-not-found means a new version; permission,
          # auth, denial, and network errors are never classified as absent.
          case "$MANIFEST_OUTPUT" in
            *"manifest unknown"*|*"not found"*|*"Not Found"*|*"NOT_FOUND"*)
              echo "Version tag $FULL_TAG is absent; a first publication of this version is required."
              printf 'push\n' > "${RUNNER_TEMP}/publish-version-required"
              ;;
            *)
              echo "::error::could not inspect $FULL_TAG (exit $MANIFEST_STATUS); auth, denial, and network errors are never classified as an absent version" >&2
              printf '%s\n' "$MANIFEST_OUTPUT" >&2
              exit 1
              ;;
          esac

      - name: Tag and push the version tag first
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          VERSION="${RELEASE_TAG#v}"
          docker tag "outlook-mcp-http:${VERSION}" "${IMAGE}:${VERSION}"
          # The push happens only when the guard proved the version absent; an
          # already-identical registry manifest never gets a redundant push.
          if [ -f "${RUNNER_TEMP}/publish-version-required" ]; then
            docker push "${IMAGE}:${VERSION}"
          else
            echo "Skipping the registry push: ${IMAGE}:${VERSION} already equals this image."
          fi

      - name: Advance latest only for the repository's current latest release
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          # The trusted source of truth for `latest` is the repository's own
          # latest release, never this run's ref: an old version tag may
          # re-publish its versioned ref but must never move latest.
          CURRENT_LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$CURRENT_LATEST" != "$RELEASE_TAG" ]; then
            echo "Not advancing latest: $RELEASE_TAG is not the current GitHub latest release ($CURRENT_LATEST is)."
            exit 0
          fi
          docker tag "outlook-mcp-http:${RELEASE_TAG#v}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

      - name: Log out of ghcr.io
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io

      - name: Record the honest visibility status
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo '### Container publication'
            echo ''
            echo "- Image ${IMAGE}:${RELEASE_TAG#v} was published from the verified Docker image archive."
            echo '- Package visibility is NOT proven: this workflow does not change package visibility, and a GitHub package may be private even when the repository is public.'
            echo '- If public anonymous pulls were selected, a package owner must set the package to Public once under Package settings on GitHub.'
            echo "- Before advertising public pulls, prove them with a fresh credential-free Docker configuration: docker pull ${IMAGE}:${RELEASE_TAG#v} must work without docker login. Until then, do not claim anonymous access."
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Cleanup workflow artifacts
    runs-on: ubuntu-latest
    needs:
      [
        release,
        installer-windows,
        installer-linux,
        smoke,
        provenance,
        publish-artifacts,
        docker-image,
        publish-container,
      ]
    if: always()
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10

    steps:
      - name: Delete workflow artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          for NAME in artifact-win-x64 artifact-linux-x64 installer-win-x64 installer-linux-x64 provenance docker-image; do
            echo "deleting artifacts named $NAME"
            IDS="$(gh api --method GET "/repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "'"${NAME}"'") | .id')"
            for ID in ${IDS}; do
              gh api --method DELETE "/repos/${REPO}/actions/artifacts/${ID}"
            done
          done
