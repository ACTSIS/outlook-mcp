# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Node.js (CommonJS), MCP SDK, Microsoft Graph API, and Power Automate Flow API
  Architecture: Modular MCP server with auth/, calendar/, email/, folder/, onedrive/, power-automate/, and utils/ modules
  Authentication: Productive OAuth server in outlook-auth-server.js; singleton TokenStorage with a shared Graph/Flow token file
  Testing: Jest 29.7 and supertest 7.0; suites under test/ cover auth, calendar, email, folders, OneDrive, Power Automate, contracts, and utilities
  Quality: ESLint 9 flat config, Prettier 3, Husky 9, and lint-staged
  CI: GitHub Actions validates Node.js 22 and 24 with npm ci, lint, format checks, and tests
  VCS: Git with GitHub Actions

strict_tdd: true
test_command: npm test

testing:
  runner: Jest 29.7.0
  test_command: npm test
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: true
    command: npm test -- --coverage
  quality:
    linter: true
    lint_command: npm run lint
    type_checker: false
    formatter: true
    format_check_command: npm run format:check
    pre_commit: Husky runs lint-staged

rules:
  proposal:
    - Include rollback plan for risky changes
    - Scope each change to a single concern
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Keep canonical product behavior separate from non-normative implementation gaps
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (CommonJS, modular structure)
      - Run ESLint and Prettier for changed implementation files
    tdd: true
    test_command: npm test
  verify:
    test_command: npm test
    build_command: ''
    lint_command: npm run lint
    format_check_command: npm run format:check
    coverage_command: npm test -- --coverage
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Preserve archived artifacts as immutable historical evidence
