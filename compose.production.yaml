services:
  mcp-http:
    image: ghcr.io/actsis/outlook-mcp:latest
    command: ['node', 'bin/m365-mcp.js', 'http']
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8444
      MCP_HTTP_REVERSE_PROXY_HTTP: 'true'
      MCP_HTTP_AUTH_MODE: bridge
      MCP_HTTP_EXTERNAL_BASE_URL: https://outlook-mcp.actsis.internal
      MCP_HTTP_LOGIN_REDIRECT_URI: https://outlook-mcp.actsis.internal/login/callback
      MCP_HTTP_BRIDGE_STORE_DIR: /app/data/oauth
      MCP_HTTP_TLS_CERT: ''
      MCP_HTTP_TLS_KEY: ''
    ports:
      - '8444:8444'
    env_file:
      - path: .env.docker
        required: false
    volumes:
      - 'bridge_oauth_prod:/app/data/oauth'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  bridge_oauth_prod:
